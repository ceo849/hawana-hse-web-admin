version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: hawana-hse-web-admin:latest
    container_name: hawana-web
    restart: unless-stopped

    depends_on:
      - core

    ports:
      - "3005:3000"

    environment:
      NODE_ENV: production

      # UI → API Proxy (UNIFIED)
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_API_PREFIX: /v1

      # API Proxy → Core (Docker Network)
      CORE_API_BASE_URL: http://hawana-core:3001

      # SSR Detection
      DOCKER_ENV: "true"

  core:
    build:
      context: .
      dockerfile: Dockerfile

    image: hawana-hse-core:latest
    container_name: hawana-core
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "3001:3001"

    environment:
      NODE_ENV: production

    # باقي إعدادات Core كما هي (لا تغيير)

  postgres:
    image: postgres:15
    container_name: hawana-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hawana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"